name: "HA Doku (PDF)"
version: "0.2.0"
slug: ha_doc
description: "Dokumentiert Home Assistant automatisch als PDF"
url: "https://github.com/markus321/ha-doc-addon"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: manual
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-outline
panel_title: HA Doku
map:
  - share:rw
options:
  schedule_enabled: false
  schedule_day: 1
  schedule_time: "03:00"
  keep_last: 12
schema:
  schedule_enabled: bool
  schedule_day: "int(1,28)"
  schedule_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  keep_last: "int(1,100)"
